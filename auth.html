<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
  <div class="max-w-md mx-auto bg-white p-6 rounded shadow">
    <h1 class="text-xl font-bold mb-4">Welcome to Note App</h1>

    <input type="text" id="username" placeholder="Username" class="w-full border p-2 mb-2" />
    <input type="password" id="password" placeholder="Password" class="w-full border p-2 mb-4" />

    <div class="flex gap-4">
      <button id="registerBtn" class="bg-green-500 text-white px-4 py-2 rounded w-1/2">Register</button>
      <button id="loginBtn" class="bg-blue-500 text-white px-4 py-2 rounded w-1/2">Login</button>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
