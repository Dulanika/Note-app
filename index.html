<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

  <div class="bg-white p-8 rounded shadow-md w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-6 text-center">Login</h1>
    <form id="loginForm" class="flex flex-col gap-4">
      <input type="text" id="username" placeholder="Username" required class="border rounded px-3 py-2">
      <input type="password" id="password" placeholder="Password" required class="border rounded px-3 py-2">
      <button type="submit" class="bg-green-500 text-white rounded px-3 py-2 hover:bg-green-600">Login</button>
    </form>
    <p class="mt-4 text-center text-sm">Don't have an account? 
      <a href="register.html" class="text-blue-500 hover:underline">Register here</a>
    </p>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      if (login(username, password)) {
        window.location.href = "dashboard.html";
      } else {
        alert("Invalid username or password!");
      }
    });
  </script>
</body>
</html>
