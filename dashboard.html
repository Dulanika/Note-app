<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
  <div class="max-w-xl mx-auto bg-white p-6 rounded shadow">

    <div class="flex justify-between mb-4 items-center">
      <h2 class="text-xl font-semibold">Hello, <span id="currentUser"></span></h2>
      <button id="logoutBtn" class="text-red-500">Logout</button>
    </div>

    <input type="text" id="noteTitle" placeholder="Title" class="w-full border p-2 mb-2" />
    <textarea id="noteContent" placeholder="Content" class="w-full border p-2 mb-2"></textarea>
    <button id="saveNoteBtn" class="bg-green-500 text-white px-4 py-2 w-full rounded mb-4">Save Note</button>

    <ul id="notesList" class="space-y-2"></ul>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
