<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="max-w-3xl mx-auto py-8">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold">Your Notes</h1>
      <button id="logoutBtn" class="bg-red-500 text-white rounded px-4 py-2 hover:bg-red-600">Logout</button>
    </div>

    <form id="noteForm" class="flex flex-col gap-4 mb-8 bg-white p-6 rounded shadow">
      <input type="text" id="noteTitle" placeholder="Note title" required class="border rounded px-3 py-2">
      <textarea id="noteContent" placeholder="Your note..." required class="border rounded px-3 py-2"></textarea>
      <button type="submit" class="bg-blue-500 text-white rounded px-3 py-2 hover:bg-blue-600">Save Note</button>
    </form>

    <div id="notesList" class="grid gap-4"></div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/notes.js"></script>
  <script>
    if (!isLoggedIn()) {
      window.location.href = "index.html";
    }

    document.getElementById("logoutBtn").addEventListener("click", function() {
      logout();
      window.location.href = "index.html";
    });

    getNotes();
    renderNotes();
  </script>
</body>
</html>
